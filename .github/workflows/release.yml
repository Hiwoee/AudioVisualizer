name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: dotnet publish AudioVisualizer.csproj -c Release -o bin/publish -p:EnableCompressionInSingleFile=false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          Set-Content release-notes.md $env:NOTES
          gh release create "build-${{ github.run_number }}" bin/publish/AudioVisualizer.exe `
            --title "Build ${{ github.run_number }}" `
            --notes-file release-notes.md `
            --target $env:GITHUB_SHA
